{% extends "base.html" %}
{% load tailwind_filters %}

{% block content %}
<div class="max-w-md mx-auto mt-16 mb-20">
    <div class="bg-white p-8 md:p-10 rounded-2xl border border-gray-200 shadow-lg">
        
        <div class="text-center mb-8">
            <span class="text-5xl">🌾</span>
            <h2 class="text-3xl font-extrabold text-gray-900 mt-4 tracking-tight">Welcome Back</h2>
            <p class="text-gray-500 mt-2">Sign in to your HelpFarmers account</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            {{ form|crispy }}
            
            <button type="submit" class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition duration-200 ease-in-out transform hover:-translate-y-0.5">
                Log In
            </button>
        </form>
        
        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <p class="text-sm text-gray-500">
                Don't have an account? <br>
                <span class="text-gray-700 font-medium">Contact your Farm Manager to get set up.</span>
            </p>
        </div>

    </div>
</div>
{% endblock %}
