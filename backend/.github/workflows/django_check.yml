name: Django System Failsafe

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  system-check:
    runs-on: ubuntu-latest
    
    # Set the working directory if your manage.py is inside a 'backend' folder
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django System Check
      env:
        # Django will crash trying to load settings.py if these are missing.
        # They do not need to be your real production secrets; dummy values work perfectly.
        SECRET_KEY: "ci-dummy-secret-key-123"
        DEBUG: "True"
        # If your settings.py requires a DATABASE_URL to boot, provide a dummy SQLite one:
        # DATABASE_URL: "sqlite:////tmp/db.sqlite3"
      run: |
        python manage.py check
