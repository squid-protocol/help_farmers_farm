name: HelpFarmers CI Pipeline

# 1. THE TRIGGERS: Run this whenever code is pushed or a pull request is opened on the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 2. THE MATRIX: Test against three versions of Python simultaneously
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    # 3. THE DATABASE: Spin up a temporary PostgreSQL server just for this test run
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: farm_logs
          POSTGRES_USER: farm_admin
          POSTGRES_PASSWORD: your_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # 4. THE CODE: Download your repository onto the cloud server
    - name: Checkout Code
      uses: actions/checkout@v4

    # 5. THE ENVIRONMENT: Install Python using the Matrix version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Speeds up future runs by caching your packages

    # 6. THE DEPENDENCIES: CD into backend and install packages
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install flake8 coverage black

    # 7. GATE 1: THE LINTER (Fails the build if the code is sloppy)
    - name: Run Flake8
      run: |
        cd backend
        flake8 .

    # 8. GATE 2: THE LOGIC & COVERAGE (Fails if tests fail or coverage drops)
    - name: Run Tests
      run: |
        cd backend
        coverage run manage.py test
        coverage report --fail-under=75