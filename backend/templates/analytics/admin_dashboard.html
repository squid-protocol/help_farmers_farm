{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto py-12 px-4">
    <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">👑 System Health: Admin Adoption</h1>
        <p class="text-gray-500 mt-2">Aggregated usage report for all registered farms.</p>
    </div>

    <div hx-get="{% url 'get_adoption_report' %}" hx-trigger="load">
        <div class="text-center py-20">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full mb-4"></div>
            <p class="text-gray-500 font-medium">Gathering farm-wide adoption metrics...</p>
        </div>
    </div>
</div>
{% endblock %}
