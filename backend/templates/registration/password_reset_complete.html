{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-16 mb-20">
    <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm text-center">
        <span class="text-5xl">✅</span>
        <h2 class="text-2xl font-bold text-gray-900 mt-4 mb-2">Password Reset Complete</h2>
        <p class="text-gray-500 mb-6">Your password has been set. You may go ahead and log in now.</p>
        
        <a href="{% url 'login' %}" class="w-full inline-block bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl shadow transition">
            Go to Login
        </a>
    </div>
</div>
{% endblock %}
