{% extends "base.html" %}
{% load tailwind_filters %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm text-center">
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Forgot Password?</h2>
        <p class="text-gray-500 mb-6">Enter your email address and we'll send you a link to reset your password.</p>
        
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition">
                Send Reset Link
            </button>
        </form>
    </div>
</div>
{% endblock %}
