{% extends "base.html" %}
{% load tailwind_filters %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Change Password</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="w-full mt-4 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow transition">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
