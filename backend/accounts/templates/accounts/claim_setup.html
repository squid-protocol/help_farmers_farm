{% extends 'base.html' %}
{% load tailwind_filters %}
{% block content %}
<div class="max-w-md mx-auto mt-16 mb-20">
    <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-lg">
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight text-center">Almost done, {{ claim_user.first_name }}!</h2>
        <p class="text-gray-500 mt-2 mb-8 text-center">Set an email and password to secure your account and start logging hours.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition">Secure My Account</button>
        </form>
    </div>
</div>
{% endblock %}
