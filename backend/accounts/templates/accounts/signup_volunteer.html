{% extends "base.html" %}
{% load tailwind_filters %}

{% block content %}
<div class="max-w-md mx-auto mt-16 mb-20 px-4">
    <div class="text-center mb-8">
        <span class="text-5xl block mb-4">🌾</span>
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Join the Harvest</h1>
        <p class="text-gray-500 mt-2">Create your free volunteer account to start logging hours.</p>
    </div>

    <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-xl">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div class="hidden" aria-hidden="true">
                <label for="website_url">Personal Website</label>
                <input type="text" name="website_url" id="website_url" tabindex="-1" autocomplete="off">
            </div>

            {{ form|crispy }}
            
            <div class="cf-turnstile mt-4" data-sitekey="0x4AAAAAADU_K4sBw06JNZlD"></div>
            
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow transition mt-6">
                Create Volunteer Account
            </button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-500">
            Already have an account? <a href="{% url 'login' %}" class="text-emerald-600 hover:underline font-bold">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
