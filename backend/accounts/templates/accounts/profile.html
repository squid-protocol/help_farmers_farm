{% extends "base.html" %}
{% load tailwind_filters %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10">
    <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
        
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-100">
            <h2 class="text-3xl font-extrabold text-gray-900">Your Profile</h2>
            <a href="{% url 'password_change' %}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg transition">
                Change Password
            </a>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-green-50 border border-green-200 text-green-800 p-4 rounded-lg mb-6 font-medium">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl shadow transition">
                Save Changes
            </button>
        </form>

    </div>
</div>
{% endblock %}
