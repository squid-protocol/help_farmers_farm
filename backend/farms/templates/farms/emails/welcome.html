<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { border-bottom: 2px solid #10b981; padding-bottom: 10px; margin-bottom: 20px; }
        .footer { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; font-size: 12px; color: #666; }
        .credentials { background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin: 20px 0; }
        .btn { display: inline-block; background: #10b981; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Welcome to {{ farm.name }}!</h2>
        </div>
        
        <div>
            {{ custom_body|safe }}
        </div>

        <div class="credentials">
            <p><strong>Your Account Details:</strong></p>
            <p>Username: <strong>{{ user.username }}</strong></p>
            <p>Temporary Password: <strong>{{ raw_password }}</strong></p>
        </div>

        <p><a href="{{ login_url }}" class="btn">Click here to log in</a></p>
        
        <div class="footer">
            This is an automated message sent via the HelpFarmers platform on behalf of {{ farm.name }}.
        </div>
    </div>
</body>
</html>
