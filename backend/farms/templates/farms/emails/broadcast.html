<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { border-bottom: 2px solid #10b981; padding-bottom: 10px; margin-bottom: 20px; color: #10b981; font-weight: bold; }
        .footer { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            Message from {{ farm.name }}
        </div>
        
        <div class="content">
            {{ custom_body|safe }}
        </div>
        
        <div class="footer">
            You are receiving this message because you are an active volunteer at {{ farm.name }}.
        </div>
    </div>
</body>
</html>
