{% extends "base.html" %}

{% block content %}
<style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: flex; }
</style>

<div class="max-w-6xl mx-auto space-y-12">
    
    <div class="text-center">
        <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Seasonal Labor Hours: {{ farm.name }}</h1>
        <p class="text-lg text-gray-500 mt-2">Filter to see how volunteer hours break down across the farm.</p>
    </div>

    <div>
        <form class="flex flex-col sm:flex-row gap-4 mb-4 justify-center" 
              hx-get="{% url 'get_impact_chart' %}" 
              hx-target="#chart-1-container" 
              hx-trigger="change">
            
            <select name="timeframe" class="bg-white border border-gray-300 text-gray-700 py-2 px-4 rounded-lg shadow-sm focus:ring-emerald-500 focus:border-emerald-500 font-medium cursor-pointer">
                <option value="all">All-Time</option>
                <option value="30">Last 30 Days</option>
                <option value="90">Last 90 Days</option>
                <option value="365">Past Year</option>
            </select>
            
            <select name="crop_id" class="bg-white border border-gray-300 text-gray-700 py-2 px-4 rounded-lg shadow-sm focus:ring-emerald-500 focus:border-emerald-500 font-medium cursor-pointer">
                <option value="all">All Crops</option>
                {% for crop in crops %}
                    <option value="{{ crop.id }}">{{ crop.crop_name }}</option>
                {% endfor %}
            </select>
        </form>

        <div class="bg-white p-2 md:p-6 rounded-2xl border border-gray-200 shadow-sm relative min-h-[500px]">
            <div class="htmx-indicator absolute inset-0 bg-white bg-opacity-75 items-center justify-center rounded-2xl z-10">
                <svg class="animate-spin h-10 w-10 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </div>
            
            <div id="chart-1-container" 
                 hx-get="{% url 'get_impact_chart' %}" 
                 hx-trigger="revealed">
            </div>
        </div>
    </div>

    <div class="pt-8 border-t border-gray-200">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Dominant Activities per Week</h2>
            <p class="text-gray-500">See the seasonal rhythm of planting, tending, and harvesting for each crop group.</p>
        </div>

        <form class="flex justify-center mb-4" 
              hx-get="{% url 'get_activity_heatmap' %}" 
              hx-target="#chart-2-container" 
              hx-trigger="change">
            
            <select name="year" class="bg-white border border-gray-300 text-gray-700 py-2 px-4 rounded-lg shadow-sm focus:ring-emerald-500 focus:border-emerald-500 font-medium cursor-pointer">
                <option value="all">All Years Combined</option>
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
            </select>
        </form>

        <div class="bg-white p-2 md:p-6 rounded-2xl border border-gray-200 shadow-sm relative min-h-[500px]">
            <div class="htmx-indicator absolute inset-0 bg-white bg-opacity-75 items-center justify-center rounded-2xl z-10">
                <svg class="animate-spin h-10 w-10 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </div>
            
            <div id="chart-2-container" 
                 hx-get="{% url 'get_activity_heatmap' %}" 
                 hx-trigger="revealed">
            </div>
        </div>
    </div>

</div>
{% endblock %}
