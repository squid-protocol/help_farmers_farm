{% extends "base.html" %}
{% load tailwind_filters %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 mb-20">
    <div class="mb-6">
        <a href="{% url 'manager_dashboard' %}" class="text-gray-500 hover:text-emerald-600 font-bold transition flex items-center gap-1">
            ← Back to Dashboard
        </a>
    </div>

    <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-lg">
        <h2 class="text-2xl font-extrabold text-gray-900 mb-6">{{ title }}</h2>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form|crispy }}
            
            <div class="pt-4 flex justify-end gap-3 border-t border-gray-100 mt-6">
                <a href="{% url 'manager_dashboard' %}" class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition">Cancel</a>
                <button type="submit" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
