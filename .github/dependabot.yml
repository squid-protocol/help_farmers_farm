version: 2
updates:
  # Maintain Python dependencies (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    
  # Maintain Tailwind/Node dependencies (package.json)
  - package-ecosystem: "npm"
    directory: "/theme/static_src"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "frontend"

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "actions"
