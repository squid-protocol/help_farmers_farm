name: HelpFarmers CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: farm_logs
          POSTGRES_USER: farm_admin
          POSTGRES_PASSWORD: your_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install coverage ruff pytest pytest-django

    - name: Lint and Format with Ruff
      run: |
        ruff check backend/
        ruff format --check backend/

    - name: Django System and Migration Check
      run: |
        cd backend
        python manage.py check
        python manage.py makemigrations --check --dry-run

    - name: Run Tests & Generate Report
      env:
        DJANGO_SETTINGS_MODULE: helpfarmersfarm.settings
      run: |
        cd backend
        coverage run -m pytest
        coverage report