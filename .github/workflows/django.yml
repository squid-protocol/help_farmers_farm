name: HelpFarmers CI Pipeline

# 1. THE TRIGGERS: Run this whenever code is pushed or a pull request is opened on the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 2. THE DATABASE: Spin up a temporary PostgreSQL server just for this test run
    services:
      postgres:
        image: postgres:14 # (or whatever version you are using)
        env:
          POSTGRES_DB: farm_logs
          POSTGRES_USER: farm_user
          # THE FIX: Hardcode a fake password just for the temporary test container
          POSTGRES_PASSWORD: super_secret_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # 3. THE CODE: Download your repository onto the cloud server
    - name: Checkout Code
      uses: actions/checkout@v4

    # 4. THE ENVIRONMENT: Install Python 3.12
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip' # Speeds up future runs by caching your packages

    # 5. THE DEPENDENCIES: Install Django, Plotly, Flake8, etc.
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install flake8 coverage black

    # 6. GATE 1: THE LINTER (Fails the build if the code is sloppy)
    - name: Run Flake8
      run: |
        cd backend
        flake8 .

    # 7. GATE 2: THE LOGIC & COVERAGE
    - name: Run Tests
      run: |
        cd backend
        coverage run manage.py test
        coverage report --fail-under=75