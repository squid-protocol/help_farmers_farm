name: HelpFarmers CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: farm_logs
          POSTGRES_USER: farm_admin
          # THE FIX: Pull the password securely from GitHub Secrets
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install flake8 coverage black

    - name: Run Flake8
      run: |
        cd backend
        flake8 .

    - name: Run Tests
      # THE FIX: Pass the secrets into the testing environment so Django can boot
      env:
        SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DATABASE_URL: postgres://farm_admin:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/farm_logs
        DEBUG: "False"
      run: |
        cd backend
        coverage run manage.py test
        coverage report --fail-under=75