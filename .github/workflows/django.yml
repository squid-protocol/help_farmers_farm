name: HelpFarmers CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: farm_logs
          POSTGRES_USER: farm_user
          POSTGRES_PASSWORD: super_secret_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install flake8 coverage black

    - name: Run Flake8
      run: |
        cd backend
        flake8 .

    - name: Run Tests
      env:
        # Hardcoded testing values so CI can run perfectly without needing Secrets
        SECRET_KEY: fake_testing_secret_key_123
        DATABASE_URL: postgres://farm_user:super_secret_test_password@localhost:5432/farm_logs
        DEBUG: "False"
      run: |
        cd backend
        coverage run manage.py test
        coverage report --fail-under=75